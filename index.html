<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Builder Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f6f8; --surface:#fff; --surface-2:#eef2f5; --ink:#11201f; --ink-soft:#52635f;
    --line:#dde5e6; --brand:#0f766e; --brand-ink:#fff; --bot-bubble:#fff;
    --user-bubble:#0f766e; --user-ink:#fff; --accent:#e8622c; --wa:#25936b;
    --shadow:0 1px 2px rgba(17,32,31,.06),0 8px 24px rgba(17,32,31,.06);
    --radius:18px;
    --font-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --font-body:"Manrope",-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --bg:#0c1413; --surface:#111c1b; --surface-2:#162423; --ink:#e8efee; --ink-soft:#9fb2ae;
    --line:#223432; --brand:#2dd4bf; --brand-ink:#06231f; --bot-bubble:#162423;
    --user-bubble:#2dd4bf; --user-ink:#06231f; --accent:#ff7a47; --wa:#30b981;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark; } }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--brand),#0b544e);display:grid;place-items:center;color:var(--brand-ink);font-family:var(--font-display);font-weight:700;font-size:20px}
  .brand-text{min-width:0;display:flex;flex-direction:column}
  .brand-text b{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
  .brand-text span{color:var(--ink-soft);font-size:12.5px}
  .status{display:inline-flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
  .wa-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:999px;white-space:nowrap}
  .wa-btn svg{width:16px;height:16px;fill:currentColor}
  .scroll{flex:1;min-height:0;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
  .row{display:flex} .row.user{justify-content:flex-end}
  .bubble{max-width:82%;padding:11px 14px;border-radius:var(--radius);box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere}
  .row.bot .bubble{background:var(--bot-bubble);border:1px solid var(--line);border-bottom-left-radius:6px}
  .row.user .bubble{background:var(--user-bubble);color:var(--user-ink);border-bottom-right-radius:6px}
  .bubble a{color:inherit;font-weight:700}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);opacity:.5;animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px)) 6px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .composer{display:flex;gap:10px;align-items:flex-end;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  textarea{flex:1;min-width:0;resize:none;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;max-height:120px}
  textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
  .send{flex:none;border:none;cursor:pointer;width:46px;height:46px;border-radius:13px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
  .send:disabled{opacity:.45;cursor:default} .send svg{width:20px;height:20px;fill:currentColor}
  .foot{text-align:center;color:var(--ink-soft);font-size:11.5px;padding:6px 16px 10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">WB</div>
    <div class="brand-text">
      <b>Web Builder</b>
      <span class="status"><span class="dot"></span>POS &middot; Websites &middot; Mobile Apps</span>
    </div>
    <a class="wa-btn" href="https://wa.me/923075267349" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.519 5.26l-.999 3.648 3.979-1.995zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.151-.174.2-.298.3-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
      WhatsApp
    </a>
  </header>
  <div class="scroll" id="scroll" aria-live="polite"></div>
  <div class="quick" id="quick">
    <button class="chip">I run a retail shop</button>
    <button class="chip">I have a restaurant</button>
    <button class="chip">I need a website</button>
    <button class="chip">I want a mobile app</button>
  </div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Type your message..." autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.39 1.2L4.2 11l9 1-9 1-2.19 6.2a1 1 0 001.39 1.2z"/></svg>
    </button>
  </form>
  <div class="foot">Powered by Web Builder &middot; replies may be AI-generated</div>
</div>
<script>
  // Same-origin endpoint — this page is served from /functions/v1/chat, the bot
  // lives next to it at /functions/v1/ai-chat. No CORS, no sandbox block.
  const ENDPOINT = "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/ai-chat";
  const scroll = document.getElementById("scroll");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const quick = document.getElementById("quick");
  const history = [];
  let busy = false;
  const GREETING = "Hi! Welcome to Web Builder. We build POS billing software, websites, and mobile apps for shops and businesses. What kind of business do you run?";
  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function render(text){
    let t = esc(text);
    t = t.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/(\+?92[\s-]?3\d{2}[\s-]?\d{7}|0307[\s-]?5267349)/g, m => {
      const digits = m.replace(/[^\d]/g, "").replace(/^0/, "92");
      return '<a href="https://wa.me/' + digits + '" target="_blank" rel="noopener">' + m + '</a>';
    });
    return t;
  }
  function addBubble(role, text){
    const row = document.createElement("div");
    row.className = "row " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    if (role === "bot") b.innerHTML = render(text); else b.textContent = text;
    row.appendChild(b); scroll.appendChild(row); scroll.scrollTop = scroll.scrollHeight;
    return b;
  }
  function showTyping(){
    const row = document.createElement("div");
    row.className = "row bot"; row.id = "typing-row";
    row.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    scroll.appendChild(row); scroll.scrollTop = scroll.scrollHeight;
  }
  function hideTyping(){ const t=document.getElementById("typing-row"); if(t) t.remove(); }
  async function send(text){
    if (busy || !text.trim()) return;
    busy = true; sendBtn.disabled = true; quick.hidden = true;
    addBubble("user", text); history.push({ role:"user", content:text }); showTyping();
    try {
      const res = await fetch(ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ messages: history, channel:"website" }),
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || "Sorry, I had trouble replying. Please message us on WhatsApp: +92 307 5267349";
      addBubble("bot", reply); history.push({ role:"assistant", content:reply });
    } catch (e) {
      hideTyping();
      addBubble("bot", "I couldn't connect right now. Please reach us on WhatsApp: +92 307 5267349");
    } finally { busy = false; sendBtn.disabled = false; input.focus(); }
  }
  addBubble("bot", GREETING); history.push({ role:"assistant", content:GREETING });
  form.addEventListener("submit", (e) => { e.preventDefault(); const t=input.value; input.value=""; input.style.height="auto"; send(t); });
  input.addEventListener("input", () => { input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; });
  input.addEventListener("keydown", (e) => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
  quick.addEventListener("click", (e) => { const chip=e.target.closest(".chip"); if(chip) send(chip.textContent); });
  input.focus();
</script>
</body>
</html>
