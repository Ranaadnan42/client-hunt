<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Preview</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--accent:#4f6bed;--dark:#0e1424;--ink:#16181d;--muted:#6b7280;--bg:#f4f5f7;--card:#fff;--body:'Plus Jakarta Sans',system-ui,sans-serif}
html[lang=ar]{--body:'Cairo',sans-serif}
html[lang=ur]{--body:'Noto Nastaliq Urdu',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:#e9ebef;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}
i[data-lucide],svg.lucide{width:20px;height:20px}

/* desktop: phone frame + side text. phone: app full screen */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:30px 20px;flex-wrap:wrap}
.side{max-width:380px}
.side .tag{display:inline-block;background:#111;color:#7ee2a8;font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 12px;border-radius:99px;margin-bottom:16px}
.side h1{font-size:34px;line-height:1.15;margin-bottom:14px}
.side p{color:#4b5563;line-height:1.65;margin-bottom:10px}
.side ul{list-style:none;margin:16px 0 22px}
.side li{display:flex;gap:10px;align-items:flex-start;margin:9px 0;color:#374151;line-height:1.5}
.side li i{color:var(--accent);flex:none;margin-top:2px}
.cta{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#05250f;font-weight:800;padding:13px 22px;border-radius:99px}
.cta2{display:inline-flex;align-items:center;gap:8px;color:#111;font-weight:700;padding:13px 16px}
.phone{width:390px;height:800px;border-radius:54px;background:#0b0b0c;padding:14px;box-shadow:0 40px 80px -20px rgba(0,0,0,.45),0 0 0 2px #2a2a2d inset;position:relative;flex:none}
.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0b0b0c;border-radius:20px;z-index:20}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (max-width:820px){
  body{background:var(--bg)}
  .stage{padding:0;gap:0;display:block}
  .side{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}
  .phone:before{display:none}
  .screen{border-radius:0}
}

/* app ui */
.status{height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font:700 13px 'Plus Jakarta Sans';color:#fff;background:var(--dark)}
@media (max-width:820px){.status{display:none}}
.top{background:var(--dark);color:#fff;padding:14px 18px 18px;flex:none}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0}
.logo span.m{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:14px;flex:none}
.logo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.search{margin-top:14px;background:rgba(255,255,255,.1);border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.7);font-size:14px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.body::-webkit-scrollbar{display:none}
.banner{margin:16px;border-radius:22px;min-height:170px;background-size:cover;background-position:center;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end}
.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.75))}
.banner div{position:relative;padding:16px}
.banner small{display:inline-block;background:var(--accent);padding:4px 10px;border-radius:99px;font-weight:700;font-size:11px;margin-bottom:8px}
.banner h2{font-size:20px;line-height:1.25}
.sec{padding:6px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.sec h3{font-size:16px}
.sec a{color:var(--accent);font-weight:700;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px}
.chips::-webkit-scrollbar{display:none}
.chips span{flex:none;background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips span.on{background:var(--accent);color:#fff}
.items{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 10px}
.item{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.item img{width:100%;height:100px;object-fit:cover}
.item div{padding:10px 12px 12px}
.item b{display:block;font-size:13.5px;line-height:1.3;margin-bottom:6px}
.item .add{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.item .add button{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center}
.item .add button i{width:16px;height:16px}
.list{padding:0 16px}
.li{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.li .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,#fff);color:var(--accent);display:grid;place-items:center;flex:none}
.li p{font-size:12.5px;color:var(--muted);line-height:1.4}
.li b{font-size:14px}
.gal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.pane{display:none}.pane.on{display:block}
.btnw{display:flex;gap:10px;padding:6px 16px 14px}
.btnw a,.btnw button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-weight:700;font-size:14px}
.b1{background:var(--accent);color:#fff}.b2{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{flex:none;background:#fff;display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 rgba(0,0,0,.06)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#9aa0a6;padding:4px 8px;border-radius:12px}
.tabs button.on{color:var(--accent)}
.ribbon{flex:none;background:#111;color:#eee;font:600 12px/1.4 'Plus Jakarta Sans','Cairo',sans-serif;padding:8px 12px;text-align:center}
.ribbon a{color:#7ee2a8;text-decoration:underline}
.toast{position:absolute;left:14px;right:14px;bottom:86px;background:#111;color:#fff;border-radius:16px;padding:14px;font-size:13px;line-height:1.45;transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s;z-index:30}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast a{display:inline-block;margin-top:8px;background:#25d366;color:#05250f;font-weight:800;padding:7px 14px;border-radius:99px}
#loader{position:fixed;inset:0;background:#0f0d0b;display:grid;place-items:center;z-index:100;color:#ddd;font:500 15px 'Plus Jakarta Sans';transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loader">Preparing your app…</div>
<div id="root"></div>
<script>
const API = "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/make-demo";
const IMG = "https://cdn.jsdelivr.net/gh/Ranaadnan42/fb-auto-poster@main/demo_img/";
const WB_WA = "923075267349";
const PAL = {restaurant:["#c8553d","#1f1410"],cafe:["#b07d4f","#1e1611"],bakery:["#d98a6c","#2a1a17"],grocery:["#2f9e5b","#0f2418"],
  pharmacy:["#14a37f","#0b2027"],clinic:["#2b7de9","#0b1a2e"],salon:["#c9a26b","#151313"],gym:["#ff5a1f","#0e0e10"],
  fashion:["#b8866b","#141414"],electronics:["#3d7bfd","#0a0f1c"],realestate:["#c2a36b","#0f1a24"],auto:["#e5483b","#101214"],
  education:["#3a6ff7","#0d1630"],hotel:["#b9975b","#12161c"],travel:["#0fa3b1","#0b1d26"],construction:["#f2a516","#16181c"],
  jewellery:["#d4af37","#0f0d0a"],furniture:["#a0764a","#1a1612"],business:["#4f6bed","#0e1424"]};
const UI = {
  en:{home:"Home",shop:"Services",book:"Book",me:"Contact",search:"Search",popular:"Popular",all:"See all",gallery:"Gallery",
      book_t:"Book or order in 2 taps",call:"Call",wa:"WhatsApp",loc:"Location",hours:"Hours",
      rib:"📱 Free demo <b>mobile app</b> for {b} by Web Builder —",get:"Get this app",
      demo:"This is a demo. In your real app, customers order and book here and you get it instantly.",
      want:"Hi Web Builder, I want this mobile app for {b}: {u}",
      side_t:"Your own mobile app — {b}",
      side_p:"This is how {b} could look as an app on your customers' phones (Android & iPhone).",
      pts:["Customers order, book or message you in 2 taps","Push notifications: send offers straight to their phone","Your logo on their home screen — they come back again and again","Works together with your website"],
      web:"See the website demo"},
  ar:{home:"الرئيسية",shop:"الخدمات",book:"احجز",me:"تواصل",search:"بحث",popular:"الأكثر طلباً",all:"عرض الكل",gallery:"الصور",
      book_t:"احجز أو اطلب بلمستين",call:"اتصال",wa:"واتساب",loc:"الموقع",hours:"ساعات العمل",
      rib:"📱 <b>تطبيق جوال</b> تجريبي مجاني لـ {b} من Web Builder —",get:"احصل على التطبيق",
      demo:"هذه نسخة تجريبية. في تطبيقك الحقيقي يطلب العملاء ويحجزون هنا وتصلك الطلبات فوراً.",
      want:"مرحباً Web Builder، أريد هذا التطبيق لـ {b}: {u}",
      side_t:"تطبيق جوال خاص بـ {b}",side_p:"هكذا يمكن أن يظهر {b} كتطبيق على هواتف عملائك (أندرويد وآيفون).",
      pts:["العملاء يطلبون أو يحجزون أو يراسلونك بلمستين","إشعارات فورية: أرسل العروض مباشرة إلى هواتفهم","شعارك على شاشة هواتفهم — يعودون إليك دائماً","يعمل مع موقعك الإلكتروني"],
      web:"شاهد الموقع التجريبي"}};
const RTL = ["ar","ur","fa","he"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id = (location.pathname.match(/\/app\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get("id");
const icon = n => `<i data-lucide="${esc(n)}"></i>`;
let PICS = null, CAT = "business";
const pic = k => PICS && PICS.length ? PICS[k % PICS.length] : IMG + CAT + "/" + ((k % 6) + 1) + ".jpg";

function render(c){
  const lang = UI[c.lang] ? c.lang : "en", U = UI[lang], b = esc(c.business);
  document.documentElement.lang = lang; document.documentElement.dir = RTL.includes(lang) ? "rtl" : "ltr";
  document.title = `${c.business} — App`;
  const pal = PAL[CAT] || PAL.business, r = document.documentElement.style;
  r.setProperty("--accent", pal[0]); r.setProperty("--dark", pal[1]);
  const site = location.origin + "/d/" + id;
  const wa = `https://wa.me/${WB_WA}?text=` + encodeURIComponent(U.want.replace("{b}", c.business).replace("{u}", location.href));
  const ini = c.business.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const svc = (c.services || []).slice(0, 6);
  const items = svc.map((s, i) => `<div class="item"><img src="${pic(i + 1)}" alt="" loading="lazy"><div><b>${esc(s.title)}</b><div class="add"><span>${esc(c.city || "")}</span><button class="dm">${icon("plus")}</button></div></div></div>`).join("");
  const rows = svc.map(s => `<div class="li"><div class="ic">${icon(s.icon || "star")}</div><div><b>${esc(s.title)}</b><p>${esc(s.text)}</p></div></div>`).join("");
  document.getElementById("root").innerHTML = `<div class="stage">
  <div class="side">
    <span class="tag">FREE APP DEMO</span>
    <h1>${esc(U.side_t.replace("{b}", c.business))}</h1>
    <p>${esc(U.side_p.replace("{b}", c.business))}</p>
    <ul>${U.pts.map(p => `<li>${icon("circle-check")}<span>${esc(p)}</span></li>`).join("")}</ul>
    <a class="cta" href="${wa}" target="_blank" rel="noopener">${icon("message-circle")} ${esc(U.get)}</a>
    <a class="cta2" href="${site}">${icon("globe")} ${esc(U.web)}</a>
  </div>
  <div class="phone"><div class="screen">
    <div class="status"><span>9:41</span><span>●●● 5G</span></div>
    <div class="ribbon">${U.rib.replace("{b}", b)} <a href="${wa}" target="_blank" rel="noopener">${esc(U.get)}</a> · <a href="${site}">${esc(U.web)}</a></div>
    <div class="top"><div class="row"><div class="logo"><span class="m">${esc(ini)}</span><b>${b}</b></div><button class="ibtn dm">${icon("bell")}</button></div>
      <div class="search">${icon("search")}<span>${esc(U.search)}…</span></div></div>
    <div class="body">
      <div class="pane on" data-p="home">
        <div class="banner" style="background-image:url('${pic(0)}')"><div><small>${esc(c.tagline || "")}</small><h2>${esc(c.offer_title || c.hero_title || "")}</h2></div></div>
        <div class="chips">${svc.slice(0, 5).map((s, i) => `<span class="${i ? "" : "on"}">${esc(s.title)}</span>`).join("")}</div>
        <div class="sec"><h3>${esc(U.popular)}</h3><a href="#" data-go="shop">${esc(U.all)}</a></div>
        <div class="items">${items}</div>
        <div class="sec"><h3>${esc(U.gallery)}</h3></div>
        <div class="gal">${[3, 4, 5, 6, 7, 8].map(k => `<img src="${pic(k)}" alt="" loading="lazy">`).join("")}</div>
      </div>
      <div class="pane" data-p="shop"><div style="height:10px"></div><div class="list">${rows}</div></div>
      <div class="pane" data-p="book"><div class="sec" style="padding-top:16px"><h3>${esc(U.book_t)}</h3></div>
        <div class="list">${svc.slice(0, 4).map(s => `<div class="li dm" style="cursor:pointer"><div class="ic">${icon("calendar-check")}</div><div><b>${esc(s.title)}</b><p>${esc(c.hours || "")}</p></div></div>`).join("")}</div>
        <div class="btnw"><button class="b1 dm">${icon("check")} ${esc(c.cta_primary || U.book)}</button></div></div>
      <div class="pane" data-p="me"><div style="height:14px"></div><div class="list">
        <div class="li dm" style="cursor:pointer"><div class="ic">${icon("phone")}</div><div><b>${esc(U.call)}</b><p>${b}</p></div></div>
        <div class="li dm" style="cursor:pointer"><div class="ic">${icon("message-circle")}</div><div><b>${esc(U.wa)}</b><p>${b}</p></div></div>
        <div class="li"><div class="ic">${icon("map-pin")}</div><div><b>${esc(U.loc)}</b><p>${esc(c.city || "—")}</p></div></div>
        <div class="li"><div class="ic">${icon("clock")}</div><div><b>${esc(U.hours)}</b><p>${esc(c.hours || "—")}</p></div></div></div></div>
    </div>
    <div class="tabs">${[["home", "house", U.home], ["shop", "layout-grid", U.shop], ["book", "calendar", U.book], ["me", "user", U.me]]
      .map(([k, ic, t], i) => `<button data-t="${k}" class="${i ? "" : "on"}">${icon(ic)}${esc(t)}</button>`).join("")}</div>
    <div class="toast" id="toast"><span>${esc(U.demo)}</span><br><a href="${wa}" target="_blank" rel="noopener">${esc(U.get)}</a></div>
  </div></div></div>`;
  if (window.lucide) lucide.createIcons();
  const go = k => { document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.dataset.p === k));
    document.querySelectorAll(".tabs button").forEach(t => t.classList.toggle("on", t.dataset.t === k));
    document.querySelector(".body").scrollTop = 0; };
  document.querySelectorAll(".tabs button").forEach(t => t.onclick = () => go(t.dataset.t));
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  const tt = document.getElementById("toast");
  document.querySelectorAll(".dm").forEach(el => el.onclick = () => { tt.classList.add("on"); clearTimeout(window._t); window._t = setTimeout(() => tt.classList.remove("on"), 5000); });
  document.querySelectorAll(".chips span").forEach(s => s.onclick = () => { document.querySelectorAll(".chips span").forEach(x => x.classList.remove("on")); s.classList.add("on"); });
  document.querySelectorAll("img").forEach(i => i.onerror = () => { if (!i.dataset.f) { i.dataset.f = 1; i.src = IMG + "business/" + (1 + Math.floor(Math.random() * 6)) + ".jpg"; } });
}

(async () => {
  const ld = document.getElementById("loader");
  try {
    if (!id) throw new Error("no id");
    let me = ""; try { if (localStorage.getItem("wb_owner")) me = "&me=1"; } catch {}
    const j = await (await fetch(API + "?id=" + encodeURIComponent(id) + me)).json();
    if (!j.content) throw new Error("not found");
    const c = j.content; CAT = j.category || c.category || "business";
    PICS = Array.isArray(c.images) && c.images.length >= 3 ? c.images : null;
    // app English mein (ya Arabic agar business Arabic mulk ka ho) - sab se zyada log samajh saken
    let v = c;
    if (c.lang && c.lang !== "en" && c.lang !== "ar" && c.alt && c.alt.hero_title) v = Object.assign({}, c, c.alt, { business: c.business, city: c.city, images: c.images, lang: "en" });
    render(v);
  } catch (e) {
    document.getElementById("root").innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px"><div><h1 style="font-size:30px;margin-bottom:10px">App preview not found</h1><p style="color:#777;margin-bottom:22px">This demo link is not valid.</p><a href="/" style="background:#25d366;color:#05250f;padding:12px 22px;border-radius:99px;font-weight:700">Web Builder</a></div></div>`;
  }
  ld.classList.add("hide"); setTimeout(() => ld.remove(), 600);
})();
// Visitor count (admin panel) — Rana khud dekhe to ginti nahi
(function(){
  try { if (localStorage.getItem("wb_owner")) return; } catch {}
  let vid = ""; try { vid = localStorage.getItem("wb_vid") || ""; if (!vid) { vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("wb_vid", vid); } } catch {}
  try { fetch("https://fobzocsluzwcqretshnm.supabase.co/functions/v1/admin", { method:"POST", headers:{ "Content-Type":"application/json" }, keepalive:true,
    body: JSON.stringify({ action:"track", page: location.pathname, ref: document.referrer, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, lang: navigator.language, vid }) }); } catch {}
})();
</script>
</body>
</html>
