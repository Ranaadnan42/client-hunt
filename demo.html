<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Preview</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--accent:#c8963e;--dark:#14110f;--ink:#1d1a17;--muted:#6b6560;--paper:#faf8f5;--card:#ffffff;--line:rgba(0,0,0,.08);
--display:'Fraunces',Georgia,serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;--radius:22px;--lh:1.65}
html[lang=ar]{--display:'Cairo',sans-serif;--body:'Cairo',sans-serif}
html[lang=ur]{--display:'Noto Nastaliq Urdu',serif;--body:'Noto Nastaliq Urdu',serif;--lh:2.1}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:var(--lh);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* loader */
#loader{position:fixed;inset:0;background:#0f0d0b;display:grid;place-items:center;z-index:100;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:18px;color:#d9d2c9;font:500 15px 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#e2b867;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* demo ribbon */
.ribbon{position:relative;z-index:60;background:linear-gradient(90deg,#0b0b0b,#1c1c1c);color:#eee;font:500 13.5px/1.4 'Plus Jakarta Sans','Cairo',sans-serif;padding:10px 20px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.ribbon b{color:#7ee2a8}
.ribbon a{background:#25d366;color:#05250f;font-weight:700;padding:6px 14px;border-radius:99px;white-space:nowrap}
.ribbon .x{opacity:.6;font-size:18px;padding:0 6px}

/* nav */
header{position:sticky;top:0;z-index:50;transition:background .35s,box-shadow .35s,backdrop-filter .35s}
header.solid{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:78px;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font:700 20px var(--display);color:#fff;transition:color .35s}
header.solid .brand{color:var(--ink)}
.mono{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 18px var(--body);box-shadow:0 8px 20px -6px var(--accent)}
.links{display:flex;gap:30px;font-weight:600;font-size:15px;color:rgba(255,255,255,.88)}
header.solid .links{color:var(--ink)}
.links a{position:relative;padding:6px 0}
.links a:after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s}
.links a:hover:after{transform:scaleX(1)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;font-weight:700;font-size:15px;transition:transform .25s,box-shadow .25s,background .25s}
.btn svg{width:18px;height:18px}
.btn-acc{background:var(--accent);color:#fff;box-shadow:0 12px 30px -10px var(--accent)}
.btn-acc:hover{transform:translateY(-2px);box-shadow:0 18px 36px -10px var(--accent)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.burger{display:none;color:#fff}
header.solid .burger{color:var(--ink)}

/* hero */
.hero{position:relative;min-height:100svh;margin-top:-78px;display:flex;align-items:center;color:#fff;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.16) translate(-1.5%,-1%)}}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,color-mix(in srgb,var(--dark) 92%,transparent) 0%,color-mix(in srgb,var(--dark) 70%,transparent) 45%,color-mix(in srgb,var(--dark) 20%,transparent) 100%)}
html[dir=rtl] .hero:before{background:linear-gradient(260deg,color-mix(in srgb,var(--dark) 92%,transparent) 0%,color-mix(in srgb,var(--dark) 70%,transparent) 45%,color-mix(in srgb,var(--dark) 20%,transparent) 100%)}
.hero .in{padding:150px 0 170px;max-width:680px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);font-size:13.5px;font-weight:600;letter-spacing:.03em}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.hero h1{font:700 clamp(40px,6.4vw,78px)/1.04 var(--display);letter-spacing:-.02em;margin:22px 0 20px}
html[lang=ar] .hero h1{line-height:1.25;letter-spacing:0}
html[lang=ur] .hero h1{line-height:1.9;font-size:clamp(34px,5vw,58px);letter-spacing:0}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:clamp(16px,1.6vw,19px);color:rgba(255,255,255,.82);max-width:560px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.stats{position:absolute;bottom:34px;inset-inline:0}
.stats .row{display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);border-radius:20px;overflow:hidden}
.stat{padding:20px 24px;border-inline-end:1px solid rgba(255,255,255,.14)}
.stat:last-child{border:0}
.stat b{display:block;font:700 28px var(--display);color:#fff}
.stat span{font-size:13.5px;color:rgba(255,255,255,.75)}

/* marquee */
.marq{background:var(--dark);color:#fff;overflow:hidden;padding:20px 0;border-block:1px solid rgba(255,255,255,.06)}
.marq .tr{display:flex;gap:46px;width:max-content;animation:mq 34s linear infinite;font:600 18px var(--display);white-space:nowrap}
html[dir=rtl] .marq .tr{animation-name:mqr}
.marq .tr span{display:flex;align-items:center;gap:46px;opacity:.9}
.marq .tr span:after{content:"✦";color:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}

/* sections */
section{padding:110px 0}
.kicker{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
html[lang=ar] .kicker,html[lang=ur] .kicker{letter-spacing:0;font-size:15px}
.kicker:before{content:"";width:28px;height:2px;background:var(--accent)}
.h2{font:700 clamp(32px,4.2vw,52px)/1.1 var(--display);letter-spacing:-.015em;margin:14px 0 16px}
html[lang=ar] .h2{line-height:1.35;letter-spacing:0}
html[lang=ur] .h2{line-height:1.9;letter-spacing:0;font-size:clamp(28px,3.4vw,42px)}
.sub{color:var(--muted);font-size:17px;max-width:600px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:54px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:34px 30px;transition:transform .35s,box-shadow .35s,border-color .35s;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:auto -40% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);opacity:0;transition:opacity .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(0,0,0,.25);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.card:hover:before{opacity:1}
.ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,#fff);color:var(--accent);margin-bottom:22px;transition:background .35s,color .35s}
.card:hover .ic{background:var(--accent);color:#fff}
.ic svg{width:26px;height:26px}
.card h3{font:700 21px var(--display);margin-bottom:8px}
html[lang=ur] .card h3{line-height:1.9}
.card p{color:var(--muted);font-size:15.5px}

/* about */
.about{background:#fff}
.ab{display:grid;grid-template-columns:1.05fr 1fr;gap:70px;align-items:center}
.pics{position:relative;height:560px}
.pics img{position:absolute;object-fit:cover;border-radius:26px;box-shadow:0 40px 80px -40px rgba(0,0,0,.45)}
.pics .p1{inset-inline-start:0;top:0;width:76%;height:78%}
.pics .p2{inset-inline-end:0;bottom:0;width:52%;height:52%;border:8px solid #fff}
.badge{position:absolute;inset-inline-start:24px;bottom:30px;background:var(--accent);color:#fff;border-radius:20px;padding:18px 22px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px -16px var(--accent);max-width:220px;line-height:1.3}
.badge svg{width:30px;height:30px;flex:none}
.about p.t{color:var(--muted);font-size:17px;margin-bottom:16px}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 34px}
.pts div{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15.5px}
.pts svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:2px}

/* offer */
.offer{padding:0}
.ofb{position:relative;overflow:hidden;border-radius:30px;padding:64px 60px;color:#fff;background:linear-gradient(120deg,var(--dark),color-mix(in srgb,var(--accent) 70%,var(--dark)));display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;margin-top:-1px}
.ofb:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;inset-inline-end:-120px;top:-180px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.ofb h3{font:700 clamp(26px,3.2vw,40px)/1.15 var(--display);max-width:620px}
html[lang=ur] .ofb h3{line-height:1.9}
.ofb p{opacity:.85;margin-top:10px;max-width:560px}
.ofb .btn{background:#fff;color:var(--dark);position:relative;z-index:1}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:240px;gap:16px}
.gal figure{overflow:hidden;border-radius:20px;position:relative;cursor:zoom-in}
.gal figure:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal figure:nth-child(n+4){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.gal figure:hover img{transform:scale(1.08)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:90;padding:30px}
.lb.on{display:grid}
.lb img{max-height:88vh;border-radius:16px}

/* faq */
.faqw{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:start}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;font:700 18px var(--body);text-align:start}
.qa button svg{width:22px;height:22px;flex:none;transition:transform .3s;color:var(--accent)}
.qa.on button svg{transform:rotate(45deg)}
.qa .a{max-height:0;overflow:hidden;transition:max-height .4s ease;color:var(--muted)}
.qa .a p{padding-bottom:24px}

/* contact */
.contact{background:var(--dark);color:#fff}
.contact .sub{color:rgba(255,255,255,.7)}
.cw{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}
.info div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px}
.info svg{width:24px;height:24px;color:var(--accent);margin-bottom:10px}
.info small{display:block;color:rgba(255,255,255,.6);font-size:13px}
.info b{font-weight:600}
form{background:#fff;color:var(--ink);border-radius:26px;padding:36px;display:grid;gap:14px}
form input,form textarea{width:100%;font:inherit;padding:15px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);outline:none;transition:border-color .25s}
form input:focus,form textarea:focus{border-color:var(--accent)}
form textarea{min-height:120px;resize:vertical}
.map{margin-top:16px;border-radius:20px;overflow:hidden;height:220px;border:1px solid rgba(255,255,255,.1)}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(.3) contrast(1.05)}

footer{background:#0b0a09;color:rgba(255,255,255,.65);padding:46px 0;font-size:14.5px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .brand{color:#fff}

.fab{position:fixed;inset-inline-end:22px;bottom:22px;z-index:70;width:62px;height:62px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(37,211,102,.7);animation:pulse 2.4s infinite}
.fab svg{width:30px;height:30px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,140%);background:#111;color:#fff;padding:16px 22px;border-radius:16px;z-index:95;max-width:min(520px,92vw);font-size:15px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;gap:12px;align-items:center}
.toast.on{transform:translate(-50%,0)}
.toast a{background:#25d366;color:#05250f;font-weight:700;padding:8px 14px;border-radius:99px;white-space:nowrap}

.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.shown{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}

@media (max-width:960px){
 .links,.nav .btn{display:none}.burger{display:block}
 .links.open{display:flex;position:absolute;top:78px;inset-inline:0;flex-direction:column;background:#fff;color:var(--ink);padding:20px 24px;gap:6px;box-shadow:0 20px 40px -20px rgba(0,0,0,.3)}
 .grid{grid-template-columns:1fr 1fr}.ab,.faqw,.cw{grid-template-columns:1fr;gap:40px}
 .pics{height:420px}.gal{grid-template-columns:1fr 1fr;grid-auto-rows:180px}
 .gal figure:nth-child(n+2){grid-column:span 1}.gal figure:nth-child(1){grid-row:span 1}.gal figure:last-child:nth-child(even){grid-column:span 2}
}
@media (max-width:620px){
 section{padding:80px 0}.grid,.pts,.info{grid-template-columns:1fr}
 .stats{position:static;margin-top:-20px;padding-bottom:30px}.hero{flex-direction:column;justify-content:center}
 .hero .in{padding:140px 0 50px}
 .hero:before,html[dir=rtl] .hero:before{background:linear-gradient(180deg,color-mix(in srgb,var(--dark) 55%,transparent) 0%,color-mix(in srgb,var(--dark) 88%,transparent) 55%,var(--dark) 100%)}.stats .row{grid-template-columns:repeat(3,1fr)}.stat{padding:14px}.stat b{font-size:20px}.stat span{font-size:12px}
 .ofb{padding:44px 28px}.pics{height:340px}form{padding:24px}
}
</style>
</head>
<body>
<div id="loader"><div class="ld"><div class="ring"></div><span id="ldt">Preparing your website…</span></div></div>
<div id="app"></div>

<div class="toast" id="toast"><span id="tt"></span><a id="ta" target="_blank" rel="noopener">WhatsApp</a></div>

<script>
const API = "https://fobzocsluzwcqretshnm.supabase.co/functions/v1/make-demo";
const IMG = "https://cdn.jsdelivr.net/gh/Ranaadnan42/fb-auto-poster@main/demo_img/";
const WB_WA = "923075267349";
const T = {
  en:{rib:"✨ This is a <b>free demo website</b> made for {b} by Web Builder.",get:"Get it live",
      demo:"This is a demo. On your live website, this goes straight to you.",want:"Hi Web Builder, I want this website for {b}: {u}",
      made:"Website by Web Builder"},
  ar:{rib:"✨ هذا <b>موقع تجريبي مجاني</b> صُمم خصيصاً لـ {b} بواسطة Web Builder.",get:"احصل عليه الآن",
      demo:"هذه نسخة تجريبية. في موقعك الحقيقي تصلك الرسائل مباشرة.",want:"مرحباً Web Builder، أريد هذا الموقع لـ {b}: {u}",
      made:"تصميم Web Builder"},
  ur:{rib:"✨ یہ {b} کے لیے Web Builder کی بنائی ہوئی <b>مفت ڈیمو ویب سائٹ</b> ہے۔",get:"ابھی لائیو کروائیں",
      demo:"یہ ڈیمو ہے۔ آپ کی اصل ویب سائٹ پر یہ پیغام سیدھا آپ کو ملے گا۔",want:"السلام علیکم Web Builder، مجھے {b} کے لیے یہ ویب سائٹ چاہیے: {u}",
      made:"ویب سائٹ: Web Builder"}
};
const PAL = {restaurant:["#c8553d","#1f1410"],cafe:["#b07d4f","#1e1611"],bakery:["#d98a6c","#2a1a17"],grocery:["#2f9e5b","#0f2418"],
  pharmacy:["#14a37f","#0b2027"],clinic:["#2b7de9","#0b1a2e"],salon:["#c9a26b","#151313"],gym:["#ff5a1f","#0e0e10"],
  fashion:["#b8866b","#141414"],electronics:["#3d7bfd","#0a0f1c"],realestate:["#c2a36b","#0f1a24"],auto:["#e5483b","#101214"],
  education:["#3a6ff7","#0d1630"],hotel:["#b9975b","#12161c"],travel:["#0fa3b1","#0b1d26"],construction:["#f2a516","#16181c"],
  jewellery:["#d4af37","#0f0d0a"],furniture:["#a0764a","#1a1612"],business:["#4f6bed","#0e1424"]};
const LAB = {
  en:{call:"Call us",whatsapp:"WhatsApp",location:"Location",hours:"Opening hours",send:"Send message",name:"Your name",phone:"Phone number",message:"How can we help?",rights:"All rights reserved"},
  ar:{call:"اتصل بنا",whatsapp:"واتساب",location:"الموقع",hours:"ساعات العمل",send:"إرسال",name:"الاسم",phone:"رقم الجوال",message:"كيف يمكننا مساعدتك؟",rights:"جميع الحقوق محفوظة"},
  ur:{call:"کال کریں",whatsapp:"واٹس ایپ",location:"پتہ",hours:"اوقاتِ کار",send:"پیغام بھیجیں",name:"آپ کا نام",phone:"فون نمبر",message:"ہم آپ کی کیا مدد کریں؟",rights:"جملہ حقوق محفوظ ہیں"}};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id = (location.pathname.match(/\/d\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get("id");

// har category ki tasveerain - pehli hero, phir about, phir gallery (sirf chuni hui achhi tasveerain)
const ORD = {auto:[6,4,3,2,5,1],bakery:[3,5,2,4,6,1],business:[6,2,4,3,5,1],cafe:[1,6,2,4,5,3],clinic:[2,5,3,6,1,4],
  construction:[2,1,4,5],education:[2,5,3,6],electronics:[1,2,3,5,4,6],fashion:[5,1,4,3,2,6],furniture:[5,6,2,3,4,1],
  grocery:[1,6,2,4,3,5],gym:[4,6,3,1],hotel:[2,1,6,4,5,3],jewellery:[4,2,1,3],pharmacy:[2,1,3,5,4,6],
  realestate:[2,4,5,6,1,3],restaurant:[2,4,5,6,3,1],salon:[1,2,6,3,5,4],travel:[5,4,2,1,6,3]};
function img(cat, k){ const o = ORD[cat] || [1,2,3,4,5,6]; return IMG + cat + "/" + o[(k - 1) % o.length] + ".jpg"; }
function gallery(cat){ const o = ORD[cat] || [1,2,3,4,5,6]; const n = o.length >= 6 ? 6 : 4;
  return Array.from({length:n}, (_, i) => IMG + cat + "/" + o[(i + 1) % o.length] + ".jpg"); }
function icon(n){ return `<i data-lucide="${esc(n)}"></i>`; }

function render(c, cat){
  const L = T[c.lang] || T.en, b = esc(c.business), u = location.href;
  document.documentElement.lang = c.lang; document.documentElement.dir = (c.lang === "en") ? "ltr" : "rtl";
  document.title = `${c.business} — ${c.tagline || ""}`;
  const r = document.documentElement.style;
  const pal = PAL[cat] || PAL.business;
  r.setProperty("--accent", pal[0]); r.setProperty("--dark", pal[1]);
  const wa = `https://wa.me/${WB_WA}?text=` + encodeURIComponent(L.want.replace("{b}", c.business).replace("{u}", u));
  const N = c.nav || {}, lab = LAB[c.lang] || LAB.en;
  c.footer_text = (c.footer_text || "").replace(/©/g, "").trim();
  const words = (c.hero_title||"").split(" "); const last = words.pop();
  const title = esc(words.join(" ")) + (words.length ? " " : "") + `<em>${esc(last)}</em>`;
  const initials = c.business.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();
  const svc = (c.services||[]).slice(0,6);
  const mq = svc.map(s => `<span>${esc(s.title)}</span>`).join("");
  document.getElementById("app").innerHTML = `
  <div class="ribbon" id="rib"><span>${L.rib.replace("{b}", b)}</span><a href="${wa}" target="_blank" rel="noopener">${L.get}</a><button class="x" onclick="this.parentNode.remove()">×</button></div>
  <header id="hd"><div class="wrap nav">
    <a href="#top" class="brand"><span class="mono">${esc(initials)}</span>${b}</a>
    <nav class="links" id="lk"><a href="#top">${esc(N.home)}</a><a href="#services">${esc(N.services)}</a><a href="#about">${esc(N.about)}</a><a href="#gallery">${esc(N.gallery)}</a><a href="#faq">${esc(N.faq)}</a><a href="#contact">${esc(N.contact)}</a></nav>
    <a href="#contact" class="btn btn-acc">${esc(c.cta_primary)} ${icon("arrow-up-right")}</a>
    <button class="burger" onclick="document.getElementById('lk').classList.toggle('open')">${icon("menu")}</button>
  </div></header>
  <section class="hero" id="top"><div class="bg" style="background-image:url('${img(cat,1)}')"></div>
    <div class="wrap"><div class="in">
      <span class="chip rv"><i></i>${esc(c.tagline)}${c.city ? " · " + esc(c.city) : ""}</span>
      <h1 class="rv d1">${title}</h1>
      <p class="rv d2">${esc(c.hero_text)}</p>
      <div class="cta rv d3"><a href="#contact" class="btn btn-acc">${esc(c.cta_primary)} ${icon("arrow-up-right")}</a><a href="#services" class="btn btn-ghost">${esc(c.cta_secondary)}</a></div>
    </div></div>
    <div class="stats"><div class="wrap"><div class="row rv d3">${(c.stats||[]).slice(0,3).map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div></div></div>
  </section>
  <div class="marq"><div class="tr">${mq}${mq}${mq}${mq}</div></div>
  <section id="services"><div class="wrap">
    <div class="head"><div><span class="kicker rv">${esc(N.services)}</span><h2 class="h2 rv d1">${esc(c.services_title)}</h2><p class="sub rv d2">${esc(c.services_sub)}</p></div></div>
    <div class="grid">${svc.map((s,i)=>`<div class="card rv d${i%3+1}"><div class="ic">${icon(s.icon)}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join("")}</div>
  </div></section>
  <section class="about" id="about"><div class="wrap ab">
    <div class="pics rv"><img class="p1" src="${img(cat,2)}" alt="" loading="lazy"><img class="p2" src="${img(cat,3)}" alt="" loading="lazy">
      <div class="badge">${icon("award")}<span>${esc(c.tagline)}</span></div></div>
    <div><span class="kicker rv">${esc(N.about)}</span><h2 class="h2 rv d1">${esc(c.about_title)}</h2>
      ${(c.about_text||"").split(/\n+/).filter(Boolean).map((p,i)=>`<p class="t rv d${i+1}">${esc(p)}</p>`).join("")}
      <div class="pts">${(c.about_points||[]).slice(0,4).map(p=>`<div class="rv">${icon("circle-check")}<span>${esc(p)}</span></div>`).join("")}</div>
      <a href="#contact" class="btn btn-acc rv">${esc(c.cta_primary)} ${icon("arrow-up-right")}</a></div>
  </div></section>
  <section class="offer"><div class="wrap"><div class="ofb rv"><div><h3>${esc(c.offer_title)}</h3><p>${esc(c.offer_text)}</p></div><a href="#contact" class="btn">${esc(c.cta_primary)} ${icon("arrow-up-right")}</a></div></div></section>
  <section id="gallery"><div class="wrap">
    <div class="head"><div><span class="kicker rv">${esc(N.gallery)}</span><h2 class="h2 rv d1">${esc(c.gallery_title)}</h2></div></div>
    <div class="gal">${gallery(cat).map((u,i)=>`<figure class="rv d${i%3+1}"><img src="${u}" alt="" loading="lazy"></figure>`).join("")}</div>
  </div></section>
  <section id="faq" style="background:#fff"><div class="wrap faqw">
    <div><span class="kicker rv">${esc(N.faq)}</span><h2 class="h2 rv d1">${esc(c.faq_title)}</h2><p class="sub rv d2">${esc(c.contact_text)}</p></div>
    <div>${(c.faq||[]).slice(0,5).map(q=>`<div class="qa rv"><button>${esc(q.q)}${icon("plus")}</button><div class="a"><p>${esc(q.a)}</p></div></div>`).join("")}</div>
  </div></section>
  <section class="contact" id="contact"><div class="wrap cw">
    <div><span class="kicker rv">${esc(N.contact)}</span><h2 class="h2 rv d1">${esc(c.contact_title)}</h2><p class="sub rv d2">${esc(c.contact_text)}</p>
      <div class="info">
        <div class="rv demo">${icon("phone")}<small>${esc(lab.call)}</small><b>${b}</b></div>
        <div class="rv d1 demo">${icon("message-circle")}<small>${esc(lab.whatsapp)}</small><b>${b}</b></div>
        <div class="rv d2">${icon("map-pin")}<small>${esc(lab.location)}</small><b>${esc(c.city || "—")}</b></div>
        <div class="rv d3">${icon("clock")}<small>${esc(lab.hours)}</small><b>${esc(c.hours)}</b></div>
      </div>
      ${c.city ? `<div class="map rv"><iframe loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(c.city)}&z=12&output=embed"></iframe></div>` : ""}
    </div>
    <form class="rv d1" id="fm"><h3 class="h2" style="font-size:28px;margin:0 0 6px">${esc(c.cta_primary)}</h3>
      <input placeholder="${esc(lab.name)}" required><input placeholder="${esc(lab.phone)}" required><textarea placeholder="${esc(lab.message)}"></textarea>
      <button class="btn btn-acc" style="justify-content:center">${esc(lab.send)} ${icon("send")}</button></form>
  </div></section>
  <footer><div class="wrap"><a href="#top" class="brand"><span class="mono">${esc(initials)}</span>${b}</a><span>${esc(c.footer_text)}</span><span>© ${new Date().getFullYear()} ${b}. ${esc(lab.rights)} · <a href="${wa}" target="_blank" rel="noopener" style="color:#7ee2a8">${L.made}</a></span></div></footer>
  <a class="fab" href="${wa}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg></a>`;
  lucide.createIcons();
  // demo actions
  const toast = (m) => { const t = document.getElementById("toast"); document.getElementById("tt").textContent = m;
    const a = document.getElementById("ta"); a.href = wa; a.textContent = L.get; t.classList.add("on"); clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove("on"), 6000); };
  document.getElementById("fm").addEventListener("submit", e => { e.preventDefault(); toast(L.demo); });
  document.querySelectorAll(".demo").forEach(el => { el.style.cursor = "pointer"; el.onclick = () => toast(L.demo); });
  document.querySelectorAll(".qa button").forEach(bt => bt.onclick = () => { const q = bt.parentNode, a = q.querySelector(".a");
    const on = q.classList.toggle("on"); a.style.maxHeight = on ? a.scrollHeight + "px" : 0; });
  const first = document.querySelector(".qa button"); if (first) first.click();
  const lb = document.getElementById("lb");
  document.querySelectorAll(".gal img").forEach(i => i.onclick = () => { lb.querySelector("img").src = i.src; lb.classList.add("on"); });
  lb.onclick = () => lb.classList.remove("on");
  document.querySelectorAll("#lk a").forEach(a => a.onclick = () => document.getElementById("lk").classList.remove("open"));
  const hd = document.getElementById("hd");
  const onS = () => hd.classList.toggle("solid", scrollY > 60); addEventListener("scroll", onS, {passive:true}); onS();
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("shown"); io.unobserve(e.target); } }), {threshold:.12});
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  document.querySelectorAll("img").forEach(i => i.onerror = () => { if (!i.dataset.f) { i.dataset.f = 1; i.src = img("business", 1 + Math.floor(Math.random()*6)); } });
}

(async () => {
  const ld = document.getElementById("loader");
  try {
    if (!id) throw new Error("no id");
    const r = await fetch(API + "?id=" + encodeURIComponent(id));
    const j = await r.json();
    if (!j.content) throw new Error("not found");
    const cat = j.category || j.content.category || "business";
    const pre = new Image(); pre.src = img(cat, 1);
    await Promise.race([new Promise(res => { pre.onload = pre.onerror = res; }), new Promise(res => setTimeout(res, 2500))]);
    render(j.content, cat);
  } catch (e) {
    document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;font-family:'Plus Jakarta Sans',sans-serif"><div><h1 style="font:700 34px Fraunces,serif;margin-bottom:10px">Website not found</h1><p style="color:#777;margin-bottom:22px">This demo link is not valid.</p><a href="/" style="background:#25d366;color:#05250f;padding:12px 22px;border-radius:99px;font-weight:700">Web Builder</a></div></div>`;
  }
  ld.classList.add("hide"); setTimeout(() => ld.remove(), 700);
})();
</script>
</body>
</html>
